[package]
name = "movroot"
version = "0.1.0"
description = "Movroot desktop application"
edition = "2024"

[lib]
name = "movroot_lib"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
uuid = { version = "=1.29.3", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
