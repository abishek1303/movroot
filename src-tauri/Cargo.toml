[package]
name = "movroot"
version = "0.1.0"
description = "Movroot desktop application"
edition = "2024"

[lib]
name = "movroot_lib"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
uuid = { version = "=1.29.3", features = ["v4"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "sync"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false }
dotenvy = "=0.15.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
